{% extends "base.html" %}
{% block title %}Symptom Check{% endblock %}
{% block content %}
<div class="card">
  <h2>🔍 Symptom Check</h2>
  <p class="card-sub">Enter your symptoms below for AI-powered analysis.</p>
  <form id="predict-form">
    <label>Symptoms (comma-separated)
      <textarea name="symptoms_text" rows="3" placeholder="e.g. cough, high_fever, fatigue"></textarea>
    </label>
    <div class="row">
      <label>Duration (days)
        <input type="number" name="duration_days" value="1" min="1" max="120">
      </label>
      <label>Age
        <input type="number" name="age" value="{{ current_user.age or '' }}" min="1" max="120">
      </label>
      <label>Language
        <select name="language">
          <option value="en">English</option>
          <option value="ur">Roman Urdu</option>
        </select>
      </label>
    </div>
    <button type="submit" class="btn primary">Analyse</button>
  </form>
  <div id="predict-output" class="output"></div>
</div>

<!-- Print-friendly result area (hidden until populated) -->
<div id="print-area" class="print-only"></div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/predict_charts.js') }}"></script>
{% endblock %}
