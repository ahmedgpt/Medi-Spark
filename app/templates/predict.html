{% extends "base.html" %}
{% block title %}Symptom check{% endblock %}
{% block content %}
<div class="card">
  <h2>Symptom Check</h2>
  <form id="predict-form">
    <label>Symptoms (comma-separated)
      <textarea name="symptoms_text" rows="3" placeholder="e.g. cough, high_fever, fatigue"></textarea>
    </label>
    <div class="row">
      <label>Duration (days)
        <input type="number" name="duration_days" value="1" min="1" max="120">
      </label>
      <label>Age
        <input type="number" name="age" value="{{ current_user.age or '' }}" min="1" max="120">
      </label>
      <label>Language
        <select name="language">
          <option value="en">English</option>
          <option value="ur">Roman Urdu</option>
        </select>
      </label>
    </div>
    <button type="submit" class="btn primary">Analyse</button>
  </form>
  <pre id="predict-output" class="output"></pre>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
